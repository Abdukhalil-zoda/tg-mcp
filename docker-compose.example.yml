# Example only. Claude Code normally starts TgMcp itself with `docker run -i` (stdio);
# this file is handy for `config check` and `login`:
#   docker compose -f docker-compose.example.yml run --rm tgmcp config check
#   docker compose -f docker-compose.example.yml run --rm tgmcp login
services:
  tgmcp:
    image: tgmcp:dev
    stdin_open: true
    tty: false
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    cpus: 0.25
    tmpfs: [/tmp]
    env_file:
      - ./tgmcp.env            # secrets + optional overrides (from tgmcp.env.example)
    volumes:
      # Policy (from tgmcp.example.jsonc); must be readable by uid 1654: chown root:1654, chmod 0640.
      - ./tgmcp.json:/config/tgmcp.json:ro
      - tgmcp-data:/data
volumes:
  tgmcp-data:
